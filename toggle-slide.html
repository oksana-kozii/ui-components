<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Component — sliding switch</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #eef0f4;
      color: #1e2b4d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 24px;
    }
    .doc { max-width: 360px; text-align: center; }
    .doc h1 { font-size: 1.1rem; margin: 0 0 6px; }
    .doc p  { font-size: 0.9rem; color: #5f6b80; margin: 0; line-height: 1.5; }
    .demo-frame { width: 100%; max-width: 320px; }
  </style>
</head>
<body>
  <div class="doc">
    <h1>Sliding switch</h1>
    <p>A set-and-forget mode selector. The pill slides to the chosen side; a check
       rides with it — before the first label, after the second. Tap to try it.</p>
  </div>

  <div class="demo-frame">

    <!-- ==== COMPONENT — copy from here ==============================
         Re-theme via the variables in the .switch scope below.
         Structure: a recessed track, a sliding pill (.switch-thumb), and
         two options. The active side is coloured by the .is-b / .is-a class
         on .switch, set in the tiny script at the bottom.
         The two option labels can be renamed freely; keep the check span
         BEFORE the first label and AFTER the second so they mirror.        -->
    <div class="switch is-a" role="group" aria-label="Mode">
      <span class="switch-thumb" aria-hidden="true"></span>
      <button class="switch-opt" data-side="a">
        <span class="switch-check" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span>
        <span>In order</span>
      </button>
      <button class="switch-opt" data-side="b">
        <span>Shuffle</span>
        <span class="switch-check" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span>
      </button>
    </div>

    <style>
      .switch {
        --accent-start: #4a83f0;   /* theme: pill start  */
        --accent-end:   #5a5fe0;   /* theme: pill end    */
        --trough:       #e4e8f0;   /* theme: recessed track */
        --label-off:    #8a94a6;   /* theme: inactive label */
        --label-on:     #ffffff;   /* theme: active label   */
        --switch-radius: 14px;
        position: relative;
        display: flex;
        background: var(--trough);
        border-radius: var(--switch-radius);
        padding: 4px;
        box-shadow: inset 0 1px 3px rgba(30, 43, 77, 0.14);
      }
      .switch-thumb {
        position: absolute;
        top: 4px;
        left: 4px;
        width: calc(50% - 4px);
        height: calc(100% - 8px);
        border-radius: calc(var(--switch-radius) - 4px);
        background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
        box-shadow: 0 1px 4px rgba(30, 43, 77, 0.20);
        transition: transform 0.28s cubic-bezier(0.22, 0.61, 0.36, 1);
        z-index: 1;
      }
      .switch.is-b .switch-thumb { transform: translateX(100%); }
      .switch-opt {
        position: relative;
        z-index: 2;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 9px 12px;
        border: none;
        background: transparent;
        font: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--label-off);
        cursor: pointer;
        transition: color 0.2s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .switch.is-a .switch-opt[data-side="a"],
      .switch.is-b .switch-opt[data-side="b"] { color: var(--label-on); }
      .switch-check {
        display: inline-flex;
        align-items: center;
        width: 14px;         /* slot reserved on both sides so nothing reflows */
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .switch.is-a .switch-opt[data-side="a"] .switch-check,
      .switch.is-b .switch-opt[data-side="b"] .switch-check { opacity: 1; }
    </style>

    <script>
      document.querySelectorAll('.switch').forEach(function (sw) {
        sw.querySelectorAll('.switch-opt').forEach(function (opt) {
          opt.addEventListener('click', function () {
            var side = opt.getAttribute('data-side');
            sw.classList.toggle('is-a', side === 'a');
            sw.classList.toggle('is-b', side === 'b');
          });
        });
      });
    </script>
    <!-- ==== COMPONENT — …to here ==================================== -->

  </div>
</body>
</html>
